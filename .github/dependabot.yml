#
# Dependabot (QA §8.5; PLAN W8, QA-03): weekly, grouped, at most two open pull requests per ecosystem. Actions stay
# pinned to full commit SHAs; Dependabot moves the SHA and its version comment together. Its pull requests run no
# CI in the private phase until someone labels them `ci` (ci.yml), so they cost no Actions minutes by themselves.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle a week before proposing them (zizmor dependabot-cooldown)
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle a week before proposing them (zizmor dependabot-cooldown)
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Exact pins upgraded deliberately, with L5 and L7 runs (QA §8.5; ARCHITECTURE §16.7).
      - dependency-name: idevice
      - dependency-name: jktcp
      - dependency-name: udif
      - dependency-name: hfsplus
      - dependency-name: apple-codesign
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /crates/russet-testkit/node/interop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle a week before proposing them (zizmor dependabot-cooldown)
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
