#
# Stub (QA-03; PLAN W8). The device lab of QA §4.2 and §4.5. Private phase: there is no lab workflow, because the
# owner decided against an always-on self-hosted runner (decisions.md); lane A runs `cargo xtask lab --suite <s>`
# on demand on the owner's machine (W9, QA-14) and records the results in docs/lab/results/. Public phase, only if
# the owner later wants an always-on lab: the lab bridge of QA §4.5 (a private russet-lab repository triggered by
# repository_dispatch). A dispatch of this stub fails at once.

name: lab

on:
  workflow_dispatch:

permissions: {}

jobs:
  lab:
    name: lab (local only in the private phase)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Not a CI job
        run: |
          echo "::error title=lab.yml::the lab runs locally: cargo xtask lab --suite <s> in lane A (W9, QA-14; QA §4.5)"
          exit 1
