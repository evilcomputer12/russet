#
# The scheduled full run (QA §4.2 `nightly.yml`; ARCHITECTURE [D 77]; PLAN W8, QA-03). Private phase: weekly
# (QA §4.8 budgets 4 runs × 45 minutes a month); public phase: switch the cron to `0 2 * * *`.
# `cargo xtask ci --profile full`: clippy with every feature, doc tests, rustdoc -D warnings and `cargo deny check`
# with the RustSec advisories. Fuzzing (QA-16), coverage, the reproducibility check and lychee join with their
# owners' work.

name: nightly

on:
  schedule:
    - cron: "41 2 * * 0" # weekly, Sunday 02:41 UTC (private phase)
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSSET_OFFLINE: "1"
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  full:
    name: ci --profile full
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2
      - name: Install the Node interop harness (vscode-jsonrpc 9.0.3)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix crates/russet-testkit/node/interop
      - name: cargo xtask ci --profile full
        env:
          RUSSET_REQUIRE_NODE_HARNESS: "1"
        run: cargo xtask ci --profile full --require-tools --skip guard --skip check-paths
      - name: Upload the test report
        if: always()
        uses: ./.github/actions/upload-safe
        with:
          name: junit-nightly
          path: target/nextest/ci/junit.xml
