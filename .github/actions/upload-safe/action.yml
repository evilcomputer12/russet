#
# upload-safe (QA §4.1 principle 2; ARCHITECTURE §19; PLAN W8): every artifact upload goes through this action.
# It runs `cargo xtask guard apple-files secrets --artifacts <path>` first, so no Apple file (Mach-O, BOMStore/CAR,
# NIBArchive, xar, koly, IMG4, pbzx, .tbd/.xip/.ipsw/.dmg/.mobileprovision/.p8/.p12) and no secret leaves CI. The
# only exception is .github/upload-safe.toml, which names apple-release.yml's own RussetProbe Mach-O outputs by
# job and path; the calling workflow file and job id select its entries.
#
# `path` is one plain file or directory: actions/upload-artifact trims it, expands globs, `!` exclusions, `~` and
# several lines, skips `#` comments and (on Linux and macOS) reads `\` as an escape, none of which the guard would
# see, so such a path fails here before anything is uploaded (call the action once per path). The shell check
# below is a quick first pass; the guard's own check (`plain_path` in xtask/src/guard.rs) is the complete one and
# also runs before the upload step. The guard follows symlinks as upload-artifact does. A path that does not exist
# is handled as `if-no-files-found` says (the default `warn` uploads nothing, so it scans nothing). The job must
# have the Rust toolchain installed (the guard is `cargo xtask`).

name: upload-safe
description: Guard one file or directory against Apple files and secrets, then upload it as an artifact

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: One file or directory to guard and upload (no globs, exclusions, ~ or several lines)
    required: true
  retention-days:
    description: Days to keep the artifact (QA §4.4 - 14 for test reports)
    required: false
    default: "14"
  if-no-files-found:
    description: warn, error or ignore
    required: false
    default: warn

runs:
  using: composite
  steps:
    - name: Guard the upload (apple-files, secrets)
      shell: bash
      env:
        UPLOAD_PATH: ${{ inputs.path }}
        IF_MISSING: ${{ inputs.if-no-files-found }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        JOB_ID: ${{ github.job }}
      run: |
        set -euo pipefail
        case "$UPLOAD_PATH" in
          "" | *$'\n'* | *$'\r'* | *'*'* | *'?'* | *'['* | *']'* | *'{'* | *'}'* | '!'* | '~'* | '#'* | \
            [[:space:]]* | *[[:space:]])
            echo "::error title=upload-safe::path must be one plain file or directory: no globs, '!' exclusions, '~', '#' comments, several lines or surrounding whitespace, which actions/upload-artifact would read past the guard"
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" != Windows ]; then
          case "$UPLOAD_PATH" in
            *\\*)
              echo "::error title=upload-safe::path must not contain a backslash: actions/upload-artifact reads it as an escape character on $RUNNER_OS"
              exit 1
              ;;
          esac
        fi
        workflow="${WORKFLOW_REF%%@*}"
        workflow="${workflow##*/}"
        cargo xtask guard apple-files secrets --artifacts "$UPLOAD_PATH" --if-missing "$IF_MISSING" \
          --upload-allowlist .github/upload-safe.toml --workflow "$workflow" --job "$JOB_ID"
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
