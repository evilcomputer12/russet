#
# Reviewed synthetic test values that look like secrets or device identifiers (QA-02; ARCHITECTURE §12.2, §19;
# PLAN W8). `cargo xtask guard secrets` skips a finding of its built-in scan or of gitleaks when the SHA-256 of
# the matched value is listed here: the value as found (upper-cased for UDIDs), or the secret gitleaks reports.
# Digests rather than file positions, so an entry survives rebases and also covers the history gitleaks reads; the
# value never appears in this file.
#
# Rules:
#   - List only values that are synthetic: test keys and tokens made for a test, UDIDs with a hand-typed ECID.
#     Never a real key, token, UDID, ECID, team id or Apple ID; real identifiers go into your local denylist.
#   - New synthetic UDIDs should use chip id 00000000 or an all-zero ECID, which the guard knows without an entry.
#   - Get an entry with `cargo xtask guard secrets --suggest-allowlist` on your machine (it refuses to run on CI,
#     because a digest of a real identifier can be brute-forced), then fill in `owner` and `reason`.
#   - Changing this file is a review item for the owner (.github/CODEOWNERS).

