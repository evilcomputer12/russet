#
# The machine-readable copy of PLAN §3 (who owns which paths) and ARCHITECTURE §5.1–§5.2 (the layer of every
# workspace package, binaries included, and the layering rules). Read by `cargo xtask check-layers` and
# `cargo xtask check-paths --ws WNN`. Paths are repository-relative globs (`*` stays inside one directory, `**`
# crosses directories, `{a,b}` alternates). Within a wave, owned paths are disjoint; across waves a path changes
# owner after the earlier card merged (PLAN §3). Lead-owned after W1 merges.

schema = 1

[seams]
# Lead-only after W1 merges (PLAN §0 rule 2). `extension/package.json` joins this list once W14 merges it.
lead-only = [
    "Cargo.toml",
    "crates/russet-protocol/Cargo.toml",
    "crates/russetd/Cargo.toml",
    "crates/russet-cli/Cargo.toml",
    "crates/russet-protocol/src/{lib,registry,macros}.rs",
    "crates/russetd/src/handlers/mod.rs",
    "crates/russetd/src/doctor_registry.rs",
    "crates/russet-cli/src/cmd/mod.rs",
    "crates/russet-core/src/error/codes/mod.rs",
    "xtask/src/main.rs",
    "xtask/Cargo.toml",
    "docs/ARCHITECTURE.md",
]

[layers]
# ARCHITECTURE §5.1 "Layer" column; binaries (russet-tool, russet-adi-host, russet-cli's `russet`) included.
"russet-plist" = "F"
"russet-macho" = "F"
"russet-ipa" = "F"
"russet-gdbremote" = "F"
"russet-car" = "F"
"russet-assets" = "F"
"russet-xcstrings" = "F"
"russet-ib" = "F"
"russet-xcodeproj" = "F"
"russet-pif" = "F"
"russet-xar" = "F"
"russet-tool" = "F"
"russet-core" = "L0"
"russet-protocol" = "L1"
"russet-ipc" = "L2"
"russet-config" = "L2"
"russet-secrets" = "L2"
"russet-toolchain" = "L2"
"russet-doctor" = "L2"
"russet-agent-config" = "L2"
"russet-device" = "L3"
"russet-sdk" = "L3"
"russet-build" = "L3"
"russet-sign" = "L3"
"russet-asc" = "L3"
"russet-account" = "L3"
"russet-gsa" = "L3"
"russet-anisette" = "L3"
"russet-adi-host" = "L3"
"russet-debug" = "L3"
"russet-ship" = "L3"
"russet-xctest" = "L3"
"russetd" = "L4"
"russet-mcp" = "L4"
"russet-cli" = "L4"
"russet-testkit" = "dev"
"russet-golden" = "dev"
"russet-oracle" = "dev"
"russet-lab" = "dev"
"xtask" = "dev"

[layer-rules]
# SPDX ids that count as permissive for layer F and its dependencies (ARCHITECTURE §5.2, §19).
permissive = [
    "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0",
    "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "Unlicense",
]
# No L3 crate uses the transport (ARCHITECTURE §5.2).
l3-never = ["russet-ipc"]

[layer-rules.l2-may-use]
# "L2 → L0–L1 (toolchain → config)": the only L2 → L2 edge.
"russet-toolchain" = ["russet-config"]

[layer-rules.l3-may-use]
# ARCHITECTURE §5.2 writes "A → B" for "B may depend on A"; this table lists, per dependent, the L3 crates it
# may use directly. check-layers takes the transitive closure. (`toolchain → sdk` and `ipa → device` name crates
# of layers L2 and F, which L3 may use anyway.)
"russet-build" = ["russet-sdk"]
"russet-sign" = ["russet-build"]
"russet-account" = ["russet-sign", "russet-asc", "russet-gsa"]
"russet-gsa" = ["russet-asc", "russet-anisette"]
"russet-ship" = ["russet-sign", "russet-account", "russet-asc"]
"russet-debug" = ["russet-device", "russet-build"]
"russet-xctest" = ["russet-device"]

[layer-rules.only]
# Packages that may use only these layers and packages (ARCHITECTURE §3.1, §5.2).
"russet-tool" = ["F"]
"russet-adi-host" = ["F", "L0"]
"russet-mcp" = ["L0", "L1", "L2"]
"russet-cli" = ["L0", "L1", "L2", "russetd", "russet-agent-config", "russet-mcp"]

[ws.W1]
# Wave 1, first and alone: W1 writes the first version of every crate and pre-created module file (PLAN §3). `bootstrap` keeps it out of other cards' owner lists.
title = "Bootstrap: workspace, seams and contracts"
wave = "1"
lane = "D"
bootstrap = true
owns = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "rustfmt.toml",
    ".cargo/**",
    "deny.toml",
    "about.toml",
    "REUSE.toml",
    "LICENSES/**",
    "typos.toml",
    ".gitattributes",
    ".editorconfig",
    ".gitignore",
    ".config/**",
    "AGENTS.md",
    "CLAUDE.md",
    ".envrc.example",
    "crates/**",
    "tests/lab/**",
    "xtask/**",
]

