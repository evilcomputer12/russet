#
# cargo-nextest profiles (QA §3.9.2). W8 owns CI wiring; W9 adds the lab profile.

[profile.default]
# Each test runs in its own process: per-test statics (for example the live-connector counter) stay isolated.
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.ci]
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
# target/nextest/ci/junit.xml, uploaded by ci.yml and nightly.yml through the upload-safe action (W8).
path = "junit.xml"
