[package]
name = "russetd"
description = "Russet L4: the per-user daemon (lifecycle, ctx, handlers, pipelines, permissions, approvals, jobs, leases, subscriptions, web endpoint, audit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
russet-account.workspace = true
russet-agent-config.workspace = true
russet-anisette.workspace = true
russet-asc.workspace = true
russet-build.workspace = true
russet-config.workspace = true
russet-core.workspace = true
russet-debug.workspace = true
russet-device.workspace = true
russet-doctor.workspace = true
russet-gsa.workspace = true
russet-ipc.workspace = true
russet-mcp.workspace = true
russet-protocol.workspace = true
russet-sdk.workspace = true
russet-secrets.workspace = true
russet-ship.workspace = true
russet-sign.workspace = true
russet-toolchain.workspace = true
russet-xctest.workspace = true
# Pre-declared for W2 (ARCHITECTURE §6: lifecycle, jobs, subscriptions, approvals and audit, the §6.6 web
# endpoint; core §12 logging, CORE-13), so no card edits this seam file mid-wave [D 86].
axum = { workspace = true, features = ["tokio", "http1", "ws", "query"] }
fs4.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "fs", "io-util", "sync"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald.workspace = true # under systemd (JOURNAL_STREAM set), core §12
