[package]
name = "russet-debug"
description = "Sessions, launch strategies, broker, JIT servicer, LLDB plans, DAP hub, symbols, crashes, logs, Flutter run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
russet-build.workspace = true
russet-core.workspace = true
russet-device.workspace = true
russet-doctor.workspace = true
russet-gdbremote.workspace = true
russet-protocol.workspace = true
russet-toolchain.workspace = true
serde.workspace = true
serde_json.workspace = true
symbolic = { workspace = true, features = ["demangle"] }
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "rt", "macros", "fs"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
russet-testkit.workspace = true
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "rt", "rt-multi-thread", "macros", "fs", "process"] }
