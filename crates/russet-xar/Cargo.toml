[package]
name = "russet-xar"
description = "Read-only Apple container formats for SDK and DDI import: xar, pbzx, cpio, UDIF, HFS+"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Optional readers (ARCHITECTURE §5.1): CMS signatures, UDIF images and HFS+ volumes.
cms = ["dep:cms"]
udif = ["dep:udif"]
hfsplus = ["dep:hfsplus"]

[dependencies]
cms = { workspace = true, optional = true }
flate2.workspace = true
hfsplus = { workspace = true, optional = true }
lzma-rust2.workspace = true
quick-xml.workspace = true
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
udif = { workspace = true, optional = true }
x509-cert.workspace = true
