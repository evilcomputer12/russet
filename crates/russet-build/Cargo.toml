[package]
name = "russet-build"
description = "Build orchestrator: project detection, stack adapters, Info.plist synthesis, bundle assembly, lints, metadata policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
camino = { workspace = true, features = ["serde1"] }
filetime = "0.2.29"
plist.workspace = true
russet-core.workspace = true
russet-doctor.workspace = true
russet-ipa.workspace = true
russet-macho.workspace = true
russet-plist.workspace = true
russet-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }
