[package]
name = "russet-gdbremote"
description = "gdb-remote codec, stop-reply parser, async GdbClient and interposer hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "time", "macros"] }
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }
