[package]
name = "russet-device"
description = "idevice integration: mux, pairing, tunnel, RSD, DDI, apps, launch, forwards, logs, screen, files, crashes, perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22.1" # screen.screenshot's imageBase64 (the version russet-gsa and russet-anisette use)
futures.workspace = true
idevice.workspace = true
jktcp.workspace = true
plist.workspace = true
russet-core.workspace = true
russet-doctor.workspace = true
russet-ipa.workspace = true
russet-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "macros", "serde"] }
tokio = { workspace = true, features = ["sync", "rt", "net", "io-util", "time", "macros", "fs"] }
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
