[package]
name = "russet-secrets"
description = "SecretStore over a keyring-core master key and sealed files; passphrase, env and memory stores [D 13]"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
async-trait.workspace = true
base64 = "0.23.1"
chacha20poly1305.workspace = true
getrandom = "0.4.3"
keyring-core.workspace = true
russet-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK and O_NOCTTY for local-file imports (src/file.rs).
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
