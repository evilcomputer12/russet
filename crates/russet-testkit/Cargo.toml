[package]
name = "russet-testkit"
description = "Scripted, replay and recording connectors, mock usbmuxd, cassettes, HTTP fakes, temp-home daemon fixture, RDT traces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
# The connectors return `Box<dyn idevice::ReadWrite>` (ARCHITECTURE §5.3 `io::ServiceConnector`).
idevice.workspace = true
russet-core.workspace = true
russet-device.workspace = true
serde.workspace = true
serde_json.workspace = true
# Elided Apple-file payloads are kept only as a length and a SHA-256 (QA §3.5.2).
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process"] }
toml.workspace = true
# RDT traces are stored zstd-compressed (`*.rdt.jsonl.zst`); plain `*.rdt.jsonl` is read and written too.
zstd.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
