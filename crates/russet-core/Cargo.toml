[package]
name = "russet-core"
description = "Russet L0: errors and codes, ids, directories, processes, progress sinks, rpc traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# TypeScript bindings for the wire types re-exported by russet-protocol (core §4.2).
ts = ["dep:ts-rs"]

[dependencies]
async-trait.workspace = true
fs4.workspace = true
# W2 (CORE-02): ULIDs, Entropy and the per-home hashes (crates.io-checked; already in the graph).
getrandom = "0.3.4"
process-wrap = { workspace = true, features = ["tokio1", "creation-flags", "job-object", "process-group", "process-session", "kill-on-drop"] }
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["sync", "rt", "process", "time", "io-util", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
# W2 (CORE-02): uid and owner checks, statvfs, PR_SET_PDEATHSIG, setsid, termios for secret prompts
# (crates.io-checked; already in the graph through process-wrap).
nix = { version = "0.31.3", default-features = false, features = ["fs", "user", "process", "signal", "term", "resource"] }

[target.'cfg(windows)'.dependencies]
# process-wrap's `CreationFlags` takes this crate's flag type (already in the graph through process-wrap).
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
