#
# cargo-about: THIRD-PARTY-LICENSES.html for every release artifact (core §16.3, §18). The template and the
# release wiring are W26's; the accepted list mirrors deny.toml (ARCHITECTURE §19) plus its reviewed exceptions.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
# ring and rustls ship licence files cargo-about cannot classify by itself.
workarounds = ["ring", "rustls"]
