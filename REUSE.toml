# SPDX-License-Identifier: AGPL-3.0-only
# SPDX-FileCopyrightText: 2026 Russet contributors
#
# REUSE (core §18, ARCHITECTURE §19): every source file carries SPDX headers; this file covers what cannot carry
# one (generated files, lock files, documents written before the headers existed). `reuse lint` runs in CI (W8).
version = 1
SPDX-PackageName = "russet"
SPDX-PackageDownloadLocation = "https://github.com/evilcomputer12/russet"

[[annotations]]
path = ["Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
# Generated, committed outputs (PLAN §0 rule 2): regenerate, never hand-edit.
path = ["schemas/**", "extension/src/generated/**", "docs/reference/**", "pins/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
# Russet's mark and colour themes (Studio is Xcode-style), generated by docs/design/brand/make_icons.py
# and make_themes.py, and the Apple file-type grammars (JSON and PNG carry no comments).
path = ["extension/themes/**", "extension/media/russet-icon.png", "extension/syntaxes/**",
        "extension/language-configuration/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
# Project documents and the pre-W1 skeleton.
path = [
    "README.md",
    "CREDITS.md",
    "NOTICE.md",
    "LICENSE",
    ".gitignore",
    "docs/**",
    "demo/**",
    "crates/*/README.md",
    "tests/lab/README.md",
    "xtask/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
# W14 extension: dotfiles, media assets (SVG icons, walkthrough docs), the Info.plist/entitlement data
# catalogs (JSON cannot carry a comment), the HelloProject test fixture (kept pristine, as a user's project
# would be) and the shared webview stylesheet — none carry an inline header.
path = [
    "extension/.gitignore",
    "extension/.vscodeignore",
    "extension/media/**",
    "extension/data/*.json",
    "extension/test/fixtures/**",
    "extension/webview/shared/theme.css",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
# The READMEs of the layer-F crates, AGPL-3.0-only like everything else.
path = [
    "crates/russet-plist/README.md",
    "crates/russet-macho/README.md",
    "crates/russet-ipa/README.md",
    "crates/russet-car/README.md",
    "crates/russet-assets/README.md",
    "crates/russet-xcstrings/README.md",
    "crates/russet-ib/README.md",
    "crates/russet-xcodeproj/README.md",
    "crates/russet-pif/README.md",
    "crates/russet-xar/README.md",
    "crates/russet-tool/README.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["crates/russet-gdbremote/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Russet contributors"
SPDX-License-Identifier = "AGPL-3.0-only"
